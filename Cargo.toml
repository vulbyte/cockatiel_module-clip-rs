[package]
name = "cockatiel_clip"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — !clip: timestamp the current stream position from the timeline's stream-start event"
license = "GPL-2.0"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "d8018510768ce09d1dcd61a1770b7356299af261" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v7", "v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"